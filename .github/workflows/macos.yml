name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Check architecture and release version
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import './scripts/macos-config.mjs'; assert.equal(process.arch, process.env.EXPECTED_ARCH)"
      - run: npm ci
      - run: npm test
      - name: Build, package and verify standalone app
        run: npm run desktop:dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: release/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          path: release/artifacts
          merge-multiple: true
      - name: Check both packages
        working-directory: release/artifacts
        run: |
          test "$(find . -name '*.dmg' | wc -l)" -eq 2
          test "$(find . -name '*.zip' | wc -l)" -eq 2
          sha256sum -c ./*.sha256
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Keep uploads in a draft until both architectures are attached.
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            test "$(jq -r .isDraft release-state.json)" = true || { echo 'Release already published; refusing to replace its assets.'; exit 1; }
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "山河 $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release/artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
